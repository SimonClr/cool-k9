<header tuiHeader="h1">
  <hgroup tuiTitle>
    <h1>Mes séances</h1>
  </hgroup>
</header>

<section class="session-list">
  @for (session of filteredSessions(); track session.id) {
    <app-session-card [session]="session" />
  }

  @if (filteredSessions().length === 0) {
    <tui-block-status class="empty-state">
      <tui-icon icon="@tui.inbox" class="empty-icon" />
      <p>Aucune séance trouvée</p>
    </tui-block-status>
  }
</section>
