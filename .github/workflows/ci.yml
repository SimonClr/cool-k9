name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile

      - uses: actions/upload-artifact@v4
        with:
          name: node-modules
          path: node_modules
          retention-days: 1

  build-libs:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules

      - run: pnpm nx build models

      - uses: actions/upload-artifact@v4
        with:
          name: dist-libs
          path: dist/libs
          retention-days: 1

  build-front:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules

      - uses: actions/download-artifact@v4
        with:
          name: dist-libs
          path: dist/libs

      - run: pnpm nx build cool-k9-front

  build-back:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: node-modules
          path: node_modules

      - uses: actions/download-artifact@v4
        with:
          name: dist-libs
          path: dist/libs

      - run: pnpm nx build cool-k9-back
