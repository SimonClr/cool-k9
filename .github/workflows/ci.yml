name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  build-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build models

  build-front:
    needs: build-libs
    runs-on: ubuntu-latest
    # Placeholders, not real values: this build only checks that the app compiles,
    # and its artifact is discarded. Vite inlines VITE_* at build time, so the real
    # values belong to whoever builds what ships — the hosting platform. Keeping the
    # production values here too would mean maintaining them in a second place
    # without ever verifying the deployed configuration.
    # The build still fails if a variable is missing (see vite.config.mts).
    env:
      VITE_SUPABASE_URL: https://ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      VITE_API_BASE_URL: https://ci.invalid/api
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build cool-k9-front

  build-back:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build cool-k9-back

  # The unit tests run alongside the builds rather than after them: neither suite
  # consumes a build artifact, so chaining them would only lengthen the pipeline.
  test-back:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      # --coverage is what enforces the thresholds declared in jest.config.ts;
      # without it the suite passes even when coverage has collapsed.
      - run: pnpm nx test cool-k9-back --coverage
      - name: Upload backend coverage
        # Kept even when the job fails: a threshold breach is precisely when the
        # report needs reading.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-back
          path: coverage/apps/cool-k9-back
          retention-days: 7
          if-no-files-found: ignore

  test-front:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx test cool-k9-front --coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-front
          path: coverage/apps/cool-k9-front
          retention-days: 7
          if-no-files-found: ignore
