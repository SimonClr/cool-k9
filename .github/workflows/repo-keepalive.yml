name: Repo keepalive

# Empêche GitHub de désactiver les workflows planifiés du repo.
# GitHub désactive tout workflow `schedule` après 60 jours sans commit sur le repo.
# Ce workflow committe un timestamp une fois par mois pour réinitialiser ce compteur
# (bénéficie à tous les workflows, y compris supabase-keepalive.yml).
on:
  schedule:
    # Le 1er de chaque mois à 3h UTC — ~30j d'intervalle, confortablement sous les 60j.
    - cron: '0 3 1 * *'
  # Permet aussi un déclenchement manuel depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      # `main` is governed by a ruleset requiring five status checks, which only a
      # pull request can produce, so the default GITHUB_TOKEN is rejected on push.
      # This App is listed as a bypass actor on that ruleset — the only mechanism
      # that lets a non-human identity push here. An admin's `enforce_admins: false`
      # does NOT cover Apps, which is why the plain branch protection was replaced.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KEEPALIVE_APP_ID }}
          private-key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump keepalive timestamp
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -e
          # 329927594 is the cool-k9-keepalive[bot] user id, which is what GitHub
          # matches to attribute the commit to the App rather than to a plain author.
          git config user.name  "$APP_SLUG[bot]"
          git config user.email "329927594+$APP_SLUG[bot]@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive-timestamp

          # Nothing to commit means the timestamp did not change; not a failure.
          if git diff --quiet -- .github/keepalive-timestamp; then
            echo "Timestamp unchanged, nothing to push."
            exit 0
          fi

          git add .github/keepalive-timestamp
          git commit -m "chore: repo keepalive bump [skip ci]"
          git pull --rebase
          git push