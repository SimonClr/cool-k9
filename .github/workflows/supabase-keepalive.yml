name: Supabase keepalive

on:
  schedule:
    # Quotidien à 6h UTC. Marge confortable sous le seuil de pause Supabase (7j),
    # même si un run de cron est retardé ou sauté par GitHub.
    - cron: '0 6 * * *'
  # Permet aussi un déclenchement manuel depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is empty — secret not configured"
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is empty — secret not configured"
            exit 1
          fi

          status=$(curl -s -o /tmp/body -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/keepalive" \
            -X POST \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "HTTP $status"
          cat /tmp/body

          if [ "$status" -ne 201 ]; then
            echo "::error::Supabase keepalive failed with HTTP $status"
            exit 1
          fi
          echo "Keepalive OK"
