name: Setup
description: Checkout, setup pnpm, Node and Nx cache

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 8

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - uses: actions/cache@v4
      with:
        path: .nx/cache
        key: nx-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: nx-
